name: Check build-details.json

on:
  push:
    branches:
      - check-build-details

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version: '3.14'

    - name: Check Python
      run: |
        which python

    - name: Check build-details.json
      run: |
        cat $(dirname $(which python))/../lib/python3.14/build-details.json
