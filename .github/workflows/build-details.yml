name: Check build-details.json

on:
  push:
    branches:
      - check-build-details

defaults:
  run:
    shell: bash

jobs:
  setup-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version: '3.14'

    - name: Check Python
      run: |
        which python

    - name: Check build-details.json
      run: |
        cat $(dirname $(which python))/../lib/python3.14/build-details.json

    - name: Check sysconfig variables
      run: |
        python -c "import sysconfig as s; print(s.get_config_var('LIBRARY'))"
        python -c "import sysconfig as s; print(s.get_config_var('LDLIBRARY'))"
        python -c "import sysconfig as s; print(s.get_config_var('LIBPYTHON'))"

  conda-python:
    runs-on: ubuntu-latest
    steps:
    - name: Install Pixi
      uses: prefix-dev/setup-pixi@v0.9.2
      with:
        pixi-version: v0.55.0
        run-install: false
        cache: false

    - name: Install Python
      run: |
        pixi global install "python=3.14"

    - name: Check Python
      run: |
        which python

    - name: Check build-details.json
      run: |
        cat $(dirname $(which python))/../lib/python3.14/build-details.json

    - name: Check sysconfig variables
      run: |
        python -c "import sysconfig as s; print(s.get_config_var('LIBRARY'))"
        python -c "import sysconfig as s; print(s.get_config_var('LDLIBRARY'))"
        python -c "import sysconfig as s; print(s.get_config_var('LIBPYTHON'))"
